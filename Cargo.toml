[workspace]
resolver = "2"
members = [
    "crates/interfaces",
    "crates/consensus",
    "crates/net",
    "crates/mempool",
    "crates/book",
    "crates/clearinghouse",
    "crates/oracle",
    "crates/state",
    "crates/hlwire",
    "crates/api",
    "crates/relayer",
    "crates/sim",
    "crates/node",
    "crates/chaos",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Shared dependency versions. Crates should use `foo = { workspace = true }`
# so feature sets unify and the shared target dir is reused across worktrees.
[workspace.dependencies]
interfaces = { path = "crates/interfaces" }
consensus = { path = "crates/consensus" }
net = { path = "crates/net" }
mempool = { path = "crates/mempool" }
book = { path = "crates/book" }
clearinghouse = { path = "crates/clearinghouse" }
oracle = { path = "crates/oracle" }
state = { path = "crates/state" }
hlwire = { path = "crates/hlwire" }
api = { path = "crates/api" }
relayer = { path = "crates/relayer" }
sim = { path = "crates/sim" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
borsh = { version = "1", features = ["derive"] }
blake3 = "1"
sha3 = "0.10"
secp256k1 = { version = "0.30", features = ["recovery", "global-context", "rand"] }
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
rayon = "1"
zstd = "0.13"
crossbeam-channel = "0.5"
proptest = "1"
indexmap = "2"
smallvec = "1"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

[profile.dev]
# Disk budget is ~30 GB shared by many worktrees (D21).
incremental = false
debug = "line-tables-only"

[profile.test]
opt-level = 1
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
